# Anteprima online su Render (Blueprint). Istruzioni nel README, "Anteprima online".
# Contiene solo contenuti demo pubblici; in produzione si userà l'hosting MEPA.
services:
  - type: web
    name: albertina-anteprima
    runtime: node
    region: frankfurt
    plan: 1c-2g
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /salute
    autoDeployTrigger: commit
    disk:
      name: file-caricati
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: albertina-anteprima-db
          property: connectionString
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: MEDIA_DIR
        value: /var/data/media
      - key: SEED_DEMO
        value: 'true'
      # Da compilare alla creazione: indirizzo del servizio e password per gli admin.
      - key: NEXT_PUBLIC_SERVER_URL
        sync: false
      - key: ANTEPRIMA_PASSWORD
        sync: false

databases:
  - name: albertina-anteprima-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: '16'
    # Raggiungibile solo dai servizi Render, non da internet.
    ipAllowList: []
